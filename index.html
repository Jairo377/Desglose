<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket de envío</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --tinta:#000; --suave:#000; --acento:#1e3f8a; --linea:#e5e8ee;
  --tinte:#f3f5f8; --fondo:#f6f8fb;
  --fuente:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--fuente)}
body{
  background:var(--fondo); color:var(--tinta); font-size:15px; line-height:1.4;
  padding:16px 10px 28px; display:flex; flex-direction:column; align-items:center; gap:14px;
  font-variant-numeric:tabular-nums;
}
#ticket{
  width:100%; max-width:540px; background:#fff; border:1px solid var(--linea);
  border-radius:12px; overflow:hidden;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 4px}
.info{display:grid;gap:5px;min-width:0;flex:1}
.info div,.viaje{display:flex;gap:10px}
.info b,.viaje b{flex:none;width:104px;font-weight:500;color:var(--tinta)}
.info span,.viaje span{font-weight:600;min-width:0;overflow-wrap:anywhere}
.viaje{padding:10px 20px 12px}
.logo{width:120px;flex:none}
.logo img{width:100%;height:auto;display:block}
[hidden]{display:none!important}
@media(max-width:420px){.logo{width:84px}.info b,.viaje b{width:88px}}
.tabla{padding:10px 20px 2px}
table{width:100%;border-collapse:collapse}
th{
  font-weight:500;font-size:13px;color:var(--suave);text-align:right;
  padding:8px 0;border-bottom:1.5px solid #000;
}
td{padding:9px 0;text-align:right;border-bottom:1px solid var(--linea);vertical-align:top}
tbody tr:last-child td{border-bottom:1.5px solid #000}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th:first-child,td:first-child{width:48px;white-space:nowrap}
td:nth-child(2){font-weight:600;overflow-wrap:anywhere}
th:nth-child(n+3),td:nth-child(n+3){padding-left:18px;white-space:nowrap}
th:last-child,td:last-child{padding-left:28px}
td:last-child{font-weight:600}
.envio{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:0 20px;padding:12px 0;border-bottom:1px solid var(--linea);
}
.envio span:first-child{color:var(--tinta)}
.envio span:last-child{font-weight:600;font-size:17px;color:var(--acento)}
.total{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--acento);padding:12px 20px;
}
.total span:first-child{color:#fff;font-weight:700;font-size:18px}
.total span:last-child{font-size:28px;font-weight:600;letter-spacing:-.01em;color:#fff}
#captura{width:100%;max-width:540px}
button{
  font-size:15px;font-weight:600;color:#000;background:#fff;
  border:1px solid #cfd7e5;border-radius:9px;padding:10px 20px;cursor:pointer;
}
button:active{background:var(--tinte)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid #9db3d8;outline-offset:2px}
@media print{body{background:#fff}.barra{display:none}}
</style>
</head>

  <div class="tabla">
    <table>
      <thead><tr><th>Cant.</th><th>Producto</th><th>Precio unit.</th><th>Total</th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>

  <div class="envio"><span>Envío</span><span id="envio"></span></div>
  <div class="total"><span>Total a pagar</span><span id="total"></span></div>
  <div class="viaje" id="filaViaje"><b>Fecha de viaje</b><span id="viaje"></span></div>
</div>
</div>

<div class="barra"><button id="compartir" type="button">Compartir captura</button></div>

<script>
// Parámetros de URL: ID, Nombre, Numero, Direccion, FechaViaje, Items, Envio, Total
// Items: filas separadas por "~"; cada fila = Producto^Precio^Cantidad^TotalFila
const p = new URLSearchParams(location.search);
const demo = {
  ID:"001", Nombre:"Daniel de Leon", Numero:"77147113", Direccion:"San Salvador",
  FechaViaje:"1 viaje Octubre", Items:"Facturas varias^45^1^45~Documentos legales^15^2^30~Paquete de ropa^153^1^153~Caja de repuestos automotrices con empaque especial^35.5^2^71~Medicamentos^12^1^12", Envio:"2", Total:"313"
};
const usarDemo = !p.has("ID") && !p.has("Items");
const g = k => (p.get(k) ?? (usarDemo ? demo[k] : "")).trim();
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,"")) || 0;
const money = n => "$" + n.toFixed(2);
const cant = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
const set = (id, t) => { document.getElementById(id).textContent = t; };

set("id", g("ID"));
set("nombre", g("Nombre"));
set("numero", g("Numero"));
set("direccion", g("Direccion"));
set("viaje", g("FechaViaje"));
if (!g("FechaViaje")) document.getElementById("filaViaje").hidden = true;

const filas = document.getElementById("filas");
let suma = 0;
g("Items").split("~").filter(Boolean).forEach(l => {
  const [prod = "", precio = "0", c = "0", tot = "0"] = l.split("^");
  const t = num(tot);
  suma += t;
  const tr = document.createElement("tr");
  [cant(num(c)), prod.trim(), money(num(precio)), money(t)].forEach(v => {
    const td = document.createElement("td");
    td.textContent = v;
    tr.appendChild(td);
  });
  filas.appendChild(tr);
});

const envio = num(g("Envio"));
set("envio", money(envio));
set("total", money(g("Total") !== "" ? num(g("Total")) : suma + envio));

document.getElementById("compartir").addEventListener("click", async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    const canvas = await html2canvas(document.getElementById("ticket"), {scale:3, backgroundColor:"#ffffff"});
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], "ticket-" + (g("ID") || "envio") + ".png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file]});
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  } catch (err) {
    if (err.name !== "AbortError") alert("No se pudo generar la captura. Intenta de nuevo.");
  } finally {
    btn.disabled = false;
  }
});
</script>
